<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Covo</title>
<meta property="og:title" content="A room designed in Covo">
<meta property="og:description" content="Covo restyles your room and finds the pieces you can actually buy.">
<meta property="og:image" content="https://appcovo.com/apple-touch-icon.png">
<meta name="twitter:card" content="summary">
<style>
:root{--paper:#F1EFE8;--paper-2:#FBFAF6;--ink:#1B1815;--ink-soft:#3F3A33;--taupe:#8B8377;--line:rgba(27,24,21,.10);--terra:#BE5B3C;
--serif:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink-soft);-webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{max-width:460px;width:100%;text-align:center}
.mark{width:68px;height:68px;border-radius:18px;display:block;margin:0 auto 26px}
h1{font:600 clamp(28px,6vw,38px)/1.1 var(--serif);color:var(--ink);letter-spacing:-.02em}
p{margin-top:14px;font-size:16.5px;line-height:1.6}
.cta{display:inline-block;margin-top:28px;padding:14px 26px;border-radius:999px;background:var(--terra);
  color:#fff;font:600 15px var(--sans);text-decoration:none}
.cta:hover{opacity:.92}
.note{margin-top:18px;font-size:13.5px;color:var(--taupe)}
.links{margin-top:34px;font-size:13px;color:var(--taupe)}
.links a{color:var(--taupe);text-decoration:none;margin:0 8px}
.links a:hover{color:var(--terra)}
</style>
</head>
<body>
<div class="card">
  <img class="mark" src="/apple-touch-icon.png" alt="Covo">
  <h1 id="title">A room designed in Covo</h1>
  <p id="lead">Someone shared their redesign with you. Designs stay private to the person who made them, so open Covo to make your own.</p>
  <a class="cta" href="https://apps.apple.com/app/id6771406334">Get Covo</a>
  <p class="note" id="note">Covo restyles a room from one photo and finds pieces you can actually buy.</p>
  <div class="links">
    <a href="/">Home</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/support.html">Support</a>
  </div>
</div>
<script>
  // Shared links from the app land here: /share/room/<id> and /share/wishlist/<id>.
  // The design itself stays private — we never publish someone's room — so the
  // page greets the visitor and points them at the app instead of 404'ing.
  var p = location.pathname + location.search;
  if (p.indexOf('/share/room') === 0 || location.search.indexOf('room=') > -1) {
    document.getElementById('title').textContent = 'A room designed in Covo';
    document.getElementById('lead').textContent =
      'Someone shared their redesign with you. Designs stay private to the person who made them, so open Covo to make your own.';
    document.title = 'A room designed in Covo';
  } else if (p.indexOf('/share/wishlist') === 0 || location.search.indexOf('wishlist=') > -1) {
    document.getElementById('title').textContent = 'A wishlist from Covo';
    document.getElementById('lead').textContent =
      'Someone shared the pieces they saved. Wishlists stay private to the person who made them, so open Covo to start your own.';
    document.title = 'A wishlist from Covo';
  }
</script>
</body>
</html>
